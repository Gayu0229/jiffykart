# ===============================
# Admin account defaults
# ===============================
admin.email=${ADMIN_EMAIL:admin@jiffykart.org}
admin.password=${ADMIN_PASSWORD:Jiffykart@2026}

# ===============================
# Application
# ===============================
spring.application.name=backend
spring.thymeleaf.cache=true

# Auto-activate local profile if not set externally
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ===============================
# PostgreSQL DB
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# HikariCP Connection Pool
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ===============================
# Flyway
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.check-location=true
spring.flyway.repair-on-migrate=true

# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# Multipart Uploads
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-form-post-size=-1
server.tomcat.max-swallow-size=-1

# ===============================
# Logging (Production)
# ===============================
logging.level.root=WARN
logging.level.com.jiffikart.backend=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.mail=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN

# ===============================
# Mail (Zoho)
# ===============================
spring.mail.host=smtp.zoho.in
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.debug=false
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.ssl.trust=smtp.zoho.in

